<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFAS 戦略業務BI</title>

  <!-- Google Fonts: Inter（欧文）＋ Noto Sans JP（和文） -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons（MIT、CDN経由） -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- SheetJS: Excel/CSVパーサー -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js: グラフ描画 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- グローバルスタイル -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== アプリ全体ラッパー ========== -->
  <div id="app-wrapper">

    <!-- ========== 左サイドバー ========== -->
    <aside id="sidebar" class="sidebar">

      <!-- サイドバーヘッダー（ロゴ＋タイトル） -->
      <div class="sidebar-header">
        <img src="assets/ufas_logo.png" alt="UFAS ロゴ" class="sidebar-logo" id="sidebar-logo">
        <span class="sidebar-title" id="sidebar-title-text">UFAS 戦略業務BI</span>
      </div>

      <!-- 折りたたみボタン -->
      <button class="sidebar-toggle" id="sidebar-toggle" title="サイドバーを折りたたむ">
        <i data-lucide="panel-left-close" class="icon"></i>
      </button>

      <!-- ナビゲーションメニュー -->
      <nav class="sidebar-nav" id="sidebar-nav">
        <ul class="nav-list">

          <!-- ダッシュボード（Phase 1 では空ステート） -->
          <li class="nav-item">
            <a href="#dashboard" class="nav-link" data-view="dashboard" data-label="ダッシュボード">
              <i data-lucide="layout-dashboard" class="nav-icon"></i>
              <span class="nav-label">ダッシュボード</span>
            </a>
          </li>

          <!-- ヒアリングメモ -->
          <li class="nav-item">
            <a href="#hearing-memo" class="nav-link" data-view="hearing-memo" data-label="ヒアリングメモ">
              <i data-lucide="mic" class="nav-icon"></i>
              <span class="nav-label">ヒアリングメモ</span>
            </a>
          </li>

          <!-- 企業情報台帳 -->
          <li class="nav-item">
            <a href="#company-research" class="nav-link" data-view="company-research" data-label="企業情報">
              <i data-lucide="building-2" class="nav-icon"></i>
              <span class="nav-label">企業情報</span>
            </a>
          </li>

          <!-- 過去提案書 -->
          <li class="nav-item">
            <a href="#past-proposals" class="nav-link" data-view="past-proposals" data-label="過去提案書">
              <i data-lucide="file-text" class="nav-icon"></i>
              <span class="nav-label">過去提案書</span>
            </a>
          </li>

          <!-- 区切り線 -->
          <li class="nav-divider"></li>

          <!-- AI機能 -->
          <li class="nav-item">
            <a href="#ai-feature" class="nav-link" data-view="ai-feature" data-label="AIアシスタント">
              <i data-lucide="bot" class="nav-icon"></i>
              <span class="nav-label">AIアシスタント</span>
            </a>
          </li>

          <!-- データ管理 -->
          <li class="nav-item">
            <a href="#data-manager" class="nav-link" data-view="data-manager" data-label="データ管理">
              <i data-lucide="database" class="nav-icon"></i>
              <span class="nav-label">データ管理</span>
            </a>
          </li>

        </ul>
      </nav>

    </aside>
    <!-- /sidebar -->

    <!-- ========== メインコンテンツエリア ========== -->
    <main id="main-content" class="main-content">

      <!-- 上部ヘッダーバー -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">ダッシュボード</h1>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
        </div>
      </header>

      <!-- ビューコンテナ（ルーターが切り替える） -->
      <div id="view-container" class="view-container">

        <!-- ---- ダッシュボードビュー（script.js の renderDashboard が動的に生成する） ---- -->
        <section id="view-dashboard" class="view" data-view="dashboard">
        </section>

        <!-- ---- ヒアリングメモビュー ---- -->
        <section id="view-hearing-memo" class="view" data-view="hearing-memo">

          <!-- ツールバー -->
          <div class="view-toolbar">
            <button class="btn btn--primary" id="btn-add-hearing">
              <i data-lucide="plus" class="btn-icon"></i>
              新規メモ
            </button>
            <div class="search-box">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="search-hearing" class="search-input" placeholder="顧客名・内容で検索...">
            </div>
          </div>

          <!-- カードリスト -->
          <div class="card-list" id="hearing-memo-list">
            <!-- hearing-memo.js が動的に生成 -->
          </div>

        </section>

        <!-- ---- 企業情報ビュー ---- -->
        <section id="view-company-research" class="view" data-view="company-research">

          <!-- ツールバー -->
          <div class="view-toolbar">
            <button class="btn btn--primary" id="btn-add-company">
              <i data-lucide="plus" class="btn-icon"></i>
              企業登録
            </button>
            <button class="btn btn--secondary" id="btn-search-add-company">
              <i data-lucide="globe" class="btn-icon"></i>
              企業を検索して追加
            </button>
            <div class="search-box">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="search-company" class="search-input" placeholder="社名で検索...">
            </div>
            <select class="filter-select" id="filter-industry">
              <option value="">業種: すべて</option>
              <option value="製造業">製造業</option>
              <option value="IT">IT</option>
              <option value="コンサル">コンサル</option>
              <option value="その他">その他</option>
            </select>
            <select class="filter-select" id="filter-phase">
              <option value="">フェーズ: すべて</option>
              <option value="新規事業検討初期">新規事業検討初期</option>
              <option value="事業立ち上げ中">事業立ち上げ中</option>
              <option value="成長期">成長期</option>
              <option value="成熟期">成熟期</option>
            </select>
          </div>

          <!-- 企業テーブル -->
          <div class="table-wrapper">
            <table class="data-table" id="company-table">
              <thead>
                <tr>
                  <th>社名</th>
                  <th>業種</th>
                  <th>売上高</th>
                  <th>従業員数</th>
                  <th>フェーズ</th>
                  <th>調査ステータス</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="company-table-body">
                <!-- company-research.js が動的に生成 -->
              </tbody>
            </table>
          </div>

          <!-- 詳細パネル（行クリックで展開） -->
          <div class="detail-panel" id="company-detail-panel" hidden>
            <div class="detail-panel-inner" id="company-detail-inner">
              <!-- company-research.js が動的に生成 -->
            </div>
          </div>

        </section>

        <!-- ---- 過去提案書ビュー ---- -->
        <section id="view-past-proposals" class="view" data-view="past-proposals">
          <div class="card-grid" id="proposals-grid">
            <!-- past-proposals.js が動的に生成 -->
          </div>
        </section>

        <!-- ---- AI機能ビュー ---- -->
        <section id="view-ai-feature" class="view" data-view="ai-feature">
          <div id="ai-feature-content">
            <!-- ai-assistant.js が動的に生成 -->
          </div>
        </section>

        <!-- ---- データ管理ビュー ---- -->
        <section id="view-data-manager" class="view" data-view="data-manager">
          <!-- data-manager.js が動的に生成 -->
          <div id="data-manager-content"></div>
        </section>

      </div>
      <!-- /view-container -->

    </main>
    <!-- /main-content -->

  </div>
  <!-- /app-wrapper -->

  <!-- ========== モーダルオーバーレイ ========== -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close" title="閉じる">
          <i data-lucide="x" class="icon"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- 各モジュールがフォームを注入 -->
      </div>
    </div>
  </div>

  <!-- ========== トースト通知 ========== -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ========== メインスクリプト（ES Modules） ========== -->
  <script type="module" src="script.js"></script>

</body>
</html>
